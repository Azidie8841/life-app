# docker-compose.yml = jalankan BEBERAPA container serentak (app + database)
# dengan satu arahan sahaja: `docker compose up`
#
# Ini cara kau akan test app ni di komputer sendiri, dengan database
# Postgres SEBENAR (bukan window.storage lagi), sebelum deploy ke cloud.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dana_kecemasan
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./server/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/dana_kecemasan
      PORT: 3000
      APP_PASSWORD: P@ssw0rd
      SESSION_SECRET: hanya-untuk-local-testing-je
      NODE_ENV: development
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
